<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>心動抽籤｜情侶限定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#ff758c;
    --bg-deeper:#ff7eb3;
    --wood:#ffb3c1;
    --wood-dark:#ff8fa3;
    --gold:#ff4d6d;
    --gold-light:#fff0f3;
    --cream:#fff0f5;
    --ink:#590d22;
    --jade:#ff4d6d;
    --jade-light:#ff758c;
    --stamp:#c9184a;
    --shadow:rgba(164, 19, 60, 0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, var(--bg-deep) 0%, var(--bg-deeper) 100%);
    background-attachment:fixed;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--cream);
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  /* 愛心底紋背景 */
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.15) 0 2px, transparent 2px 40px),
      repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.15) 0 2px, transparent 2px 40px);
    pointer-events:none;
    z-index:0;
  }
  .page{
    position:relative;
    width:100%;
    max-width:520px;
    padding:36px 20px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
    z-index:1;
  }
  .eyebrow{
    font-size:14px;
    letter-spacing:.35em;
    color:var(--gold-light);
    font-weight:700;
    opacity:.95;
    margin-bottom:10px;
  }
  h1{
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:clamp(32px,8vw,44px);
    line-height:1.25;
    text-align:center;
    margin:0 0 6px;
    color:#ffffff;
    text-shadow:0 3px 6px var(--shadow);
    letter-spacing:.04em;
  }
  .tagline{
    font-size:15px;
    color:var(--cream);
    opacity:.95;
    text-align:center;
    margin:2px 0;
  }
  .tagline.small{
    font-size:13px;
    opacity:.85;
    margin-bottom:26px;
  }

  /* ---- Draw arena ---- */
  .arena{
    position:relative;
    width:100%;
    max-width:340px;
    height:300px;
    margin-top:6px;
    display:flex;
    justify-content:center;
    align-items:flex-end;
  }
  .fan{
    position:absolute;
    bottom:96px;
    left:50%;
    width:2px;height:2px;
  }
  .stick{
    position:absolute;
    left:50%;
    bottom:0;
    width:34px;
    height:168px;
    transform-origin:bottom center;
    background:linear-gradient(180deg,#fff0f3 0%, #ffccd5 55%, #ffb3c1 100%);
    border-radius:8px 8px 3px 3px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.5), 0 6px 10px var(--shadow);
    cursor:pointer;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), filter .25s ease;
    animation:idleSway 4.5s ease-in-out infinite;
  }
  .stick::before{
    content:"籤";
    position:absolute;
    top:10px;left:0;right:0;
    text-align:center;
    font-family:"Zhi Mang Xing",cursive;
    font-size:17px;
    color:var(--stamp);
  }
  .stick:hover{filter:brightness(1.08);}
  .stick.drawn{
    animation:none;
    transform:translate(-50%, -260px) rotate(0deg) scale(1.08) !important;
    opacity:0;
    transition:transform .55s cubic-bezier(.5,0,.5,1), opacity .55s ease .1s;
  }
  @keyframes idleSway{
    0%,100%{ }
    50%{ filter:brightness(1.04); }
  }

  .bucket{
    position:relative;
    width:210px;
    height:150px;
    z-index:2;
  }
  .bucket-body{
    position:absolute;
    bottom:0;left:0;right:0;
    height:120px;
    background:linear-gradient(180deg,#ff8fa3,#ff758c 60%,#c9184a);
    border-radius:10px 10px 34px 34px / 10px 10px 60px 60px;
    box-shadow:0 10px 22px var(--shadow), inset 0 -14px 20px rgba(0,0,0,.15);
  }
  .bucket-rim{
    position:absolute;
    top:0;left:-6px;right:-6px;
    height:20px;
    background:linear-gradient(180deg,#ffffff,#fff0f3);
    border-radius:10px;
    box-shadow:0 3px 6px var(--shadow);
  }
  .bucket-seal{
    position:absolute;
    left:50%;top:56px;
    transform:translateX(-50%);
    width:56px;height:56px;
    border:2px solid #ffffff;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:15px;
    color:#ffffff;
    letter-spacing:.05em;
    background:rgba(255, 255, 255, 0.1);
  }

  .draw-btn{
    appearance:none;
    border:none;
    margin-top:26px;
    padding:15px 44px;
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:.12em;
    color:var(--stamp);
    background:linear-gradient(180deg,#ffffff,#fff0f3);
    border-radius:999px;
    box-shadow:0 8px 0 #ffb3c1, 0 14px 18px var(--shadow);
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .draw-btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #ffb3c1, 0 6px 10px var(--shadow);
  }
  .draw-btn:disabled{
    filter:grayscale(.4) brightness(.75);
    cursor:not-allowed;
    box-shadow:0 8px 0 #cca3b0, 0 10px 14px var(--shadow);
  }
  .limit-note{
    margin-top:12px;
    font-size:12px;
    color:var(--gold-light);
    opacity:.9;
    text-align:center;
  }

  /* ---- Result modal ---- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(89, 13, 34, 0.6);
    backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    opacity:0;pointer-events:none;
    transition:opacity .3s ease;
    z-index:10;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{
    width:100%;max-width:340px;
    background:linear-gradient(180deg,#ffffff,#fff0f3);
    border-radius:24px;
    padding:30px 26px 26px;
    text-align:center;
    color:var(--ink);
    position:relative;
    box-shadow:0 24px 50px rgba(0,0,0,.25);
    transform:scale(.85) translateY(20px);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    border:3px solid #ffccd5;
  }
  .overlay.show .card{transform:scale(1) translateY(0);}
  .card .congrats{
    font-size:20px;
    font-weight:700;
    margin:0 0 4px;
    color:var(--stamp);
  }
  .card .lead{
    font-size:14px;
    color:#800f2f;
    margin:0 0 18px;
  }
  .prize-emoji{
    font-size:48px;
    margin-bottom:6px;
    display:block;
  }
  .prize-name{
    display:inline-block;
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:22px;
    color:var(--stamp);
    border:2px solid var(--stamp);
    border-radius:12px;
    padding:4px 16px;
    margin-bottom:14px;
    background:#fff0f3;
    transform:rotate(-2deg);
  }
  .prize-title{
    font-weight:700;
    font-size:18px;
    margin:0 0 8px;
    color:#590d22;
  }
  .prize-desc{
    font-size:14px;
    line-height:1.6;
    color:#800f2f;
    margin:0 0 22px;
  }
  .close-btn{
    appearance:none;border:none;
    padding:12px 34px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    color:#ffffff;
    background:linear-gradient(180deg,#ff758c,#ff4d6d);
    box-shadow:0 6px 0 #c9184a;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .close-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #c9184a;
  }

  @media (min-width:600px){
    .arena{max-width:400px;height:340px;}
    .stick{width:38px;height:190px;}
    h1{font-size:46px;}
  }

  @media (prefers-reduced-motion: reduce){
    .stick{animation:none !important;}
    .stick.drawn, .overlay, .card{transition:none !important;}
  }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">愛意滿滿 · 情侶限定</div>
  <h1>心動情侶<br>幸運抽籤</h1>
  <p class="tagline">今天你想抽到什麼甜頭？</p>
  <p class="tagline">抽到的結果，今天必須兌現喔～</p>
  <p class="tagline small">無限次抽籤・隨時甜蜜連線！</p>

  <div class="arena">
    <div class="fan" id="fan"></div>
    <div class="bucket">
      <div class="bucket-rim"></div>
      <div class="bucket-body"></div>
      <div class="bucket-seal">緣分</div>
    </div>
  </div>

  <button class="draw-btn" id="drawBtn">我要抽籤 💖</button>
  <p class="limit-note" id="limitNote">每日無限抽，隨時手牽手！</p>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <p class="congrats">💘 甜蜜命中！</p>
    <p class="lead">你獲得了 (⁠*⁠´⁠ω⁠｀⁠*⁠)</p>
    <span class="prize-emoji" id="resultEmoji">🌸</span>
    <div class="prize-name" id="resultTag">【  】</div>
    <p class="prize-title" id="resultTitle"></p>
    <p class="prize-desc" id="resultDesc"></p>
    <button class="close-btn" id="closeBtn">收下甜蜜 (❁´◡`❁)</button>
  </div>
</div>

<script>
const prizes = [
  { tag:"甜蜜籤", emoji:"🫂", title:"深情擁抱券", desc:"免費獲得一個持續 30 秒以上的超溫暖深情擁抱。" },
  { tag:"上上籤", emoji:"👑", title:"無條件聽話券", desc:"今日內對方必須無條件服從你的一個合理要求！" },
  { tag:"舒壓籤", emoji:"💆‍♂️", title:"專屬按摩服務", desc:"享有 15 分鐘的肩頸或腿部專屬舒壓按摩。" },
  { tag:"幸運籤", emoji:"🥤", title:"手搖飲/甜點兌換券", desc:"對方今天必須請你喝一杯你最愛的飲料或甜點。" },
  { tag:"親親籤", emoji:"💋", title:"隨時吻一下券", desc:"今天隨時可以使用，要求對方給予一個甜蜜親親。" },
  { tag:"休戰籤", emoji:"🕊️", title:"原諒免死金牌", desc:"下次不小心生氣或吵架時，出示此牌可立即化解一次。" },
  { tag:"美味籤", emoji:"🍰", title:"美食指定權", desc:"下一頓大餐吃什麼，完全由你一個人說了算！" },
  { tag:"霸道籤", emoji:"🎬", title:"包攬家務一日券", desc:"今天的洗碗/垃圾/整理等家務，全由對方包辦！" }
];

const fan = document.getElementById('fan');
const drawBtn = document.getElementById('drawBtn');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeBtn');

let isDrawing = false;
const sticks = [];
const N = prizes.length;
const spread = 64; // degrees total spread

prizes.forEach((p, i) => {
  const el = document.createElement('div');
  el.className = 'stick';
  const angle = -spread/2 + (spread/(N-1)) * i;
  el.style.transform = `translateX(-50%) rotate(${angle}deg)`;
  el.style.animationDelay = (i * 0.15) + 's';
  el.dataset.index = i;
  fan.appendChild(el);
  sticks.push(el);
});

function pickRandomPrize(){
  return Math.floor(Math.random() * prizes.length);
}

function showResult(prize){
  document.getElementById('resultEmoji').textContent = prize.emoji;
  document.getElementById('resultTag').textContent = `【${prize.tag}】`;
  document.getElementById('resultTitle').textContent = prize.title;
  document.getElementById('resultDesc').textContent = prize.desc;
  overlay.classList.add('show');
}

function resetSticks(){
  sticks.forEach((s, i) => {
    s.classList.remove('drawn');
    const angle = -spread/2 + (spread/(N-1)) * i;
    s.style.transform = `translateX(-50%) rotate(${angle}deg)`;
  });
  isDrawing = false;
}

function runDraw(){
  if (isDrawing) return;
  isDrawing = true;

  const idx = pickRandomPrize();
  const chosenStick = sticks[idx];

  // brief shuffle feel: nudge all sticks
  sticks.forEach((s) => {
    s.style.transition = 'transform .25s ease';
    s.style.transform += ' translateY(-6px)';
  });

  setTimeout(() => {
    sticks.forEach((s) => { s.style.transform = s.style.transform.replace(' translateY(-6px)', ''); });
    chosenStick.classList.add('drawn');
    setTimeout(() => showResult(prizes[idx]), 500);
  }, 260);
}

drawBtn.addEventListener('click', runDraw);

sticks.forEach(s => {
  s.addEventListener('click', () => { runDraw(); });
});

function closeModal(){
  overlay.classList.remove('show');
  resetSticks();
}

closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeModal();
});
</script>
</body>
</html>
